    <circle cx="64" cy="72" r="34" pathLength="100" stroke="#7d5a86" stroke-dasharray="20 100" stroke-dashoffset="-80"/>
  </g>
  <circle cx="64" cy="72" r="26" fill="#fbf6ea"/>
