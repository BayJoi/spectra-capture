<!doctype html>
<html lang="en" data-theme="light" data-motion="on">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Spectra Capture · Annotate</title>
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="button.css" />
    <link rel="stylesheet" href="annotate.css" />
    <link rel="stylesheet" href="motion.css" />
  </head>
  <body>
    <main class="app" id="app" data-enter>
      <header class="masthead">
        <span class="mark"><img src="brand/spectra-mark.svg" data-brand="spectra-mark" alt="" width="30" height="30" /></span>
        <div class="heading">
          <h1 id="title">Annotate</h1>
          <p class="sub">Mark up the capture, then save it</p>
        </div>
        <button type="button" class="theme-switch" id="theme-toggle" role="switch" aria-checked="false" aria-label="Switch to dark theme">
          <span class="ts-opt">Light</span>
          <span class="ts-opt">Dark</span>
          <span class="ts-thumb" aria-hidden="true"></span>
        </button>
      </header>

      <section class="toolbar" aria-label="Annotation tools">
        <div class="tool-group" role="group" aria-label="Drawing tools">
          <button type="button" class="tool" data-tool="select" aria-pressed="true" aria-label="Select" title="Select">
            <span class="tool-icon"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 2l9 6-4 1-2 4z" /></svg></span>
            <span class="tool-label">Select</span>
          </button>
          <button type="button" class="tool" data-tool="pen" aria-pressed="false" aria-label="Pen" title="Pen">
            <span class="tool-icon"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 14l1-4 8-8 3 3-8 8z" /><path d="M10 4l3 3" /></svg></span>
            <span class="tool-label">Pen</span>
          </button>
          <button type="button" class="tool" data-tool="arrow" aria-pressed="false" aria-label="Arrow" title="Arrow">
            <span class="tool-icon"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 14L13 3M8 3h5v5" /></svg></span>
            <span class="tool-label">Arrow</span>
          </button>
          <button type="button" class="tool" data-tool="rect" aria-pressed="false" aria-label="Rectangle" title="Rectangle">
            <span class="tool-icon"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2.5" y="3.5" width="11" height="9" /></svg></span>
            <span class="tool-label">Rect</span>
          </button>
          <button type="button" class="tool" data-tool="ellipse" aria-pressed="false" aria-label="Ellipse" title="Ellipse">
            <span class="tool-icon"><svg viewBox="0 0 16 16" aria-hidden="true"><ellipse cx="8" cy="8" rx="5.5" ry="4" /></svg></span>
            <span class="tool-label">Ellipse</span>
          </button>
          <button type="button" class="tool" data-tool="highlight" aria-pressed="false" aria-label="Highlight" title="Highlight">
            <span class="tool-icon"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 12l7-9 3 2-7 9z" /><path d="M2 14h12" /></svg></span>
            <span class="tool-label">Highlight</span>
          </button>
          <button type="button" class="tool" data-tool="blur" aria-pressed="false" aria-label="Blur and redact" title="Blur / redact">
            <span class="tool-icon"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="3" width="12" height="10" /><path d="M4 6h8M4 9h5" /></svg></span>
            <span class="tool-label">Blur</span>
          </button>
          <button type="button" class="tool" data-tool="text" aria-pressed="false" aria-label="Text" title="Text">
            <span class="tool-icon"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 3h10M8 3v10M5 13h6" /></svg></span>
            <span class="tool-label">Text</span>
          </button>
        </div>

        <span class="divider" aria-hidden="true"></span>

        <div class="ctl-group">
          <label class="stroke-control" for="stroke">
            <span class="ctl-label">Width</span>
            <input type="range" id="stroke" min="1" max="24" value="3" />
            <output id="stroke-out" for="stroke">3 px</output>
          </label>
          <div class="swatches" role="group" aria-label="Stroke colour">
            <button type="button" class="swatch" data-swatch="ink" aria-label="Ink colour" aria-pressed="true" title="Ink"></button>
            <button type="button" class="swatch" data-swatch="vermilion" aria-label="Vermilion colour" aria-pressed="false" title="Vermilion"></button>
            <button type="button" class="swatch" data-swatch="indigo" aria-label="Indigo colour" aria-pressed="false" title="Indigo"></button>
            <button type="button" class="swatch" data-swatch="white" aria-label="White colour" aria-pressed="false" title="White"></button>
            <button type="button" class="swatch" data-swatch="black" aria-label="Black colour" aria-pressed="false" title="Black"></button>
            <button type="button" class="swatch" data-swatch="highlight" aria-label="Yellow highlight colour" aria-pressed="false" title="Highlight"></button>
          </div>
        </div>

        <span class="divider" aria-hidden="true"></span>

        <div class="action-group">
          <button type="button" class="ghost icon-btn" id="undo" aria-label="Undo" title="Undo (Ctrl+Z)">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3L2 7l4 4" /><path d="M2 7h7a4 4 0 0 1 0 8" /></svg>
            <span>Undo</span>
          </button>
          <button type="button" class="ghost icon-btn" id="clear" aria-label="Clear all annotations" title="Clear all">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 4h10M6 4V2h4v2M4 4l1 10h6l1-10" /></svg>
            <span>Clear</span>
          </button>
          <button type="button" class="primary icon-btn" id="save" aria-label="Save annotated image" title="Save (Enter)">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 2h9l3 3v9H2z" /><path d="M5 2v5h6V2M5 14V9h6v5" /></svg>
            <span>Save</span>
          </button>
        </div>
      </section>

      <section class="stage" id="stage" aria-label="Annotation canvas">
        <canvas id="canvas" aria-label="Screenshot annotation area"></canvas>
      </section>

      <footer class="footbar">
        <p class="dims" id="dims">Loading…</p>
        <p class="status" id="status">
          <svg class="tick" viewBox="0 0 16 16" aria-hidden="true"><polyline points="2,8.5 6,12.5 14,3.5" /></svg>
          <span id="status-text">Ready</span>
        </p>
        <p class="keys">Ctrl+Z undo · Esc select · Enter save</p>
        <span class="sr-only" id="status-live" role="status" aria-live="polite"></span>
      </footer>
    </main>
    <script type="module" src="annotate.js"></script>
  </body>
</html>
