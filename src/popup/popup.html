<!doctype html>
<html lang="en" data-theme="light" data-motion="on">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Spectra Capture</title>
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="button.css" />
    <link rel="stylesheet" href="popup.css" />
    <link rel="stylesheet" href="motion.css" />
  </head>
  <body>
    <canvas class="backdrop" id="backdrop" aria-hidden="true"></canvas>

    <main class="frame" id="frame">
      <div class="shutter" aria-hidden="true"><span></span><span></span></div>

      <header class="masthead">
        <span class="mark"><img src="brand/spectra-mark.svg" data-brand="spectra-mark" alt="" width="34" height="34" /></span>
        <h1 id="title" data-i18n="app.name">Spectra Capture</h1>
        <div class="tools">
          <button type="button" class="theme-switch" id="theme-toggle" role="switch" aria-checked="false">
            <span class="ts-opt" data-i18n="ui.themeLight"></span>
            <span class="ts-opt" data-i18n="ui.themeDark"></span>
            <span class="ts-thumb" aria-hidden="true"></span>
          </button>
          <a class="help-link" href="#" id="help-link" data-i18n="ui.help"></a>
        </div>
      </header>

      <nav class="tabs" role="tablist" data-i18n-aria="ui.tabsLabel" aria-label="Pages">
        <button type="button" role="tab" class="tab" id="tab-1" aria-selected="true" aria-controls="page-1"><span class="seal">1</span><span data-i18n="ui.tabSize"></span></button>
        <button type="button" role="tab" class="tab" id="tab-2" aria-selected="false" aria-controls="page-2" tabindex="-1"><span class="seal">2</span><span data-i18n="ui.tabOutput"></span></button>
        <button type="button" role="tab" class="tab" id="tab-3" aria-selected="false" aria-controls="page-3" tabindex="-1"><span class="seal">3</span><span data-i18n="ui.tabTools"></span></button>
        <button type="button" role="tab" class="tab" id="tab-4" aria-selected="false" aria-controls="page-4" tabindex="-1"><span class="seal">4</span><span data-i18n="ui.tabConsole"></span><span class="badge" id="console-badge" hidden role="status" aria-live="polite" aria-label="Warnings and errors in the console">0</span></button>
        <span class="tab-bar" aria-hidden="true"></span>
      </nav>

      <div class="pages">
        <!-- Page 1: size -->
        <section class="page is-active" id="page-1" role="tabpanel" aria-labelledby="tab-1">
          <div class="group">
            <span class="label" id="l-preset" data-i18n="ui.presetLabel"></span>
            <select id="preset" class="dd-source" aria-labelledby="l-preset"></select>
          </div>

          <div class="group">
            <div class="size-row">
              <label class="field">
                <span class="flabel" data-i18n="ui.widthCss"></span>
                <input id="width" type="text" inputmode="numeric" autocomplete="off" maxlength="5" />
              </label>
              <button type="button" class="swap" id="swap" data-i18n-title="ui.swap" aria-label="Swap width and height">
                <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 5h10M9 2l3 3-3 3M14 11H4M7 8l-3 3 3 3" /></svg>
              </button>
              <label class="field">
                <span class="flabel" data-i18n="ui.heightCss"></span>
                <input id="height" type="text" inputmode="numeric" autocomplete="off" maxlength="5" />
              </label>
            </div>
          </div>

          <div class="group">
            <span class="label" id="l-ratio" data-i18n="ui.ratioLabel"></span>
            <select id="ratio" class="dd-source" aria-labelledby="l-ratio"></select>
          </div>

          <div class="group">
            <div class="viewfinder" aria-hidden="true">
              <i class="c tl"></i><i class="c tr"></i><i class="c bl"></i><i class="c br"></i>
              <span id="ratio-shape"></span>
              <p class="readout"><span id="est-px"></span><span id="est-mp"></span></p>
            </div>
            <p class="hint" id="fullpage-hint" hidden></p>
          </div>
        </section>

        <!-- Page 2: output -->
        <section class="page" id="page-2" role="tabpanel" aria-labelledby="tab-2">
          <div class="group">
            <div class="segmented" id="mode" role="radiogroup">
              <span class="thumb" aria-hidden="true"></span>
              <label><input type="radio" name="mode" value="viewport" /><span data-i18n="ui.modeVisible"></span></label>
              <label><input type="radio" name="mode" value="fullpage" /><span data-i18n="ui.modeFull"></span></label>
              <label><input type="radio" name="mode" value="region" /><span data-i18n="ui.modeRegion"></span></label>
              <label><input type="radio" name="mode" value="element" /><span data-i18n="ui.modeElement"></span></label>
            </div>
          </div>

          <div class="group row-3">
            <div class="field">
              <span class="flabel" id="l-dpr" data-i18n="ui.density"></span>
              <select id="dpr" class="dd-source" aria-labelledby="l-dpr">
                <option value="1">1×</option>
                <option value="1.5">1.5×</option>
                <option value="2">2×</option>
                <option value="3">3×</option>
              </select>
            </div>
            <div class="field">
              <span class="flabel" id="l-format" data-i18n="ui.format"></span>
              <select id="format" class="dd-source" aria-labelledby="l-format">
                <option value="png">PNG</option>
                <option value="jpeg">JPEG</option>
              </select>
            </div>
            <label class="field">
              <span class="flabel" data-i18n="ui.qualityShort"></span>
              <input id="quality" type="text" inputmode="numeric" autocomplete="off" maxlength="3" />
            </label>
          </div>
          <p class="hint" id="dpr-hint"></p>

          <div class="receipt">
            <span class="receipt-k" data-i18n="ui.receiptLabel"></span>
            <span class="receipt-v" id="receipt-v"></span>
          </div>

          <div class="group">
            <span class="label" data-i18n="ui.optionsTitle"></span>
            <div class="check-row">
              <label class="check"><input id="warm-up" type="checkbox" /><span data-i18n="ui.scrollOnce"></span></label>
              <label class="check"><input id="motion" type="checkbox" /><span data-i18n="ui.motion"></span></label>
            </div>
          </div>

          <div class="group">
            <span class="label" data-i18n="ui.settingsTitle"></span>
            <div class="btn-row">
              <button type="button" class="ghost" id="save-size" data-i18n="ui.saveSize"></button>
              <button type="button" class="ghost" id="delete-size" data-i18n="ui.deleteSize"></button>
              <button type="button" class="ghost" id="reset" data-i18n="ui.reset"></button>
            </div>
          </div>
        </section>

        <!-- Page 3: settings (capture tools) -->
        <section class="page" id="page-3" role="tabpanel" aria-labelledby="tab-3">
          <p class="tools-intro" data-i18n="ui.toolsIntro"></p>

          <div class="group">
            <span class="label" id="l-delay" data-i18n="ui.delayLabel"></span>
            <select id="delay" class="dd-source" aria-labelledby="l-delay">
              <option value="0" data-i18n="ui.delayNone"></option>
              <option value="3">3 s</option>
              <option value="5">5 s</option>
              <option value="10">10 s</option>
            </select>
          </div>

          <div class="group">
            <span class="label" data-i18n="ui.optionsTitle"></span>
            <div class="tool-list">
              <label class="tool-row"><input id="dark-mode" type="checkbox" /><span class="tool-copy"><b data-i18n="ui.darkMode"></b></span></label>
              <label class="tool-row"><input id="hide-fixed" type="checkbox" /><span class="tool-copy"><b data-i18n="ui.hideFixed"></b></span></label>
              <label class="tool-row"><input id="save-as" type="checkbox" /><span class="tool-copy"><b data-i18n="ui.saveAs"></b><small data-i18n="ui.saveAsHint"></small></span></label>
              <label class="tool-row"><input id="copy-clipboard" type="checkbox" /><span class="tool-copy"><b data-i18n="ui.clipboard"></b><small data-i18n="ui.clipboardHint"></small></span></label>
              <label class="tool-row"><input id="annotate" type="checkbox" /><span class="tool-copy"><b data-i18n="ui.annotate"></b><small data-i18n="ui.annotateHint"></small></span></label>
              <label class="tool-row"><input id="notifications" type="checkbox" /><span class="tool-copy"><b data-i18n="ui.notifications"></b><small data-i18n="ui.notificationsHint"></small></span></label>
              <label class="tool-row"><input id="pick-timeout" type="checkbox" /><span class="tool-copy"><b data-i18n="ui.pickTimeout"></b><small data-i18n="ui.pickTimeoutHint"></small></span></label>
            </div>
          </div>
        </section>

        <!-- Page 4: console -->
        <section class="page" id="page-4" role="tabpanel" aria-labelledby="tab-4">
          <div class="console-tools">
            <button type="button" class="ghost" id="log-copy" data-i18n="ui.copy"></button>
            <button type="button" class="ghost" id="log-clear" data-i18n="ui.clear"></button>
          </div>
          <p class="log-empty" id="log-empty" data-i18n="ui.consoleEmpty"></p>
          <ol class="log" id="log" aria-live="polite" aria-relevant="additions"></ol>
        </section>
      </div>

      <p class="sr-only" id="field-error" role="alert" aria-live="assertive"></p>

      <footer class="footer">
        <button type="button" class="primary" id="capture">
          <span class="btn-label" id="capture-label" data-i18n="ui.capture"></span>
        </button>
        <div class="progress" id="progress" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span></div>
        <p class="status" id="status">
          <svg class="tick" viewBox="0 0 16 16" aria-hidden="true"><polyline points="2,8.5 6,12.5 14,3.5" /></svg>
          <span id="status-text" aria-hidden="true"></span>
        </p>
        <span class="sr-only" id="status-live" role="status" aria-live="polite"></span>
      </footer>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
