<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="Spectra Capture">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1d1a16" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="260" fill="#f7f2e6"/>
  <rect width="1200" height="260" fill="url(#grid)"/>
  <rect x="0" y="0" width="1200" height="8" fill="#c2402b"/>
  <!-- Subtle SMIL sweep; renders as a static bar where animation is stripped. -->
  <rect x="-160" y="0" width="160" height="8" fill="#e0543d">
    <animate attributeName="x" from="-160" to="1200" dur="5s" repeatCount="indefinite"/>
  </rect>
  <rect x="60" y="48" width="164" height="164" fill="#fffdf6" stroke="#1d1a16" stroke-width="4"/>
  <circle cx="142" cy="130" r="58" fill="none" stroke="#1d1a16" stroke-width="8"/>
  <circle cx="142" cy="130" r="38" fill="#c2402b" fill-opacity="0.12" stroke="#c2402b" stroke-width="4"/>
  <path d="M118 130h48M142 106v48" stroke="#1d1a16" stroke-width="3"/>
  <text x="260" y="132" font-family="Inter, Arial, sans-serif" font-size="62" font-weight="700" letter-spacing="2" fill="#1d1a16">SPECTRA CAPTURE</text>
  <text x="264" y="178" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="500" letter-spacing="4" fill="#5f5649">ANY SIZE · FOUR MODES · RUNS LOCALLY</text>
  <rect x="1020" y="48" width="120" height="40" fill="#1d1a16"/>
  <text x="1080" y="75" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" fill="#f7f2e6">v0.7.1</text>
</svg>
